pub_rate: 1.0
base_path: '' # Optional, prepended to all diagnostic output
analyzers:
  sound_play:
    type: diagnostic_aggregator/GenericAnalyzer
    path: SoundPlay
    startswith: sound_play
  breakers:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Breakers
    analyzers:
      base_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Base Breaker
        startswith: base_breaker
      battery_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Battery Breaker
        startswith: battery_breaker
      computer_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Computer Breaker
        startswith: computer_breaker
      supply_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Supply Breaker
        startswith: supply_breaker
      arm_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Arm Breaker
        startswith: arm_breaker
      gripper_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Gripper Breaker
        startswith: gripper_breaker
  motors:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Motor Control Boards
    analyzers:
      l_wheel:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Left Wheel
        startswith: l_wheel
      r_wheel:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Right Wheel
        startswith: r_wheel
      shoulder_pan:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Shoulder Pan Joint
        startswith: shoulder_pan
      shoulder_lift:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Shoulder Lift Joint
        startswith: shoulder_lift
      upperarm_roll:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Upperarm Roll Joint
        startswith: upperarm_roll
      elbow_flex:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Elbow Flex Joint
        startswith: elbow_flex
      forearm_roll:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Forearm Roll Joint
        startswith: forearm_roll
      wrist_flex:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Wrist Flex Joint
        startswith: wrist_flex
      wrist_roll:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Wrist Roll Joint
        startswith: wrist_roll
      head_tilt:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Head Tilt Joint
        startswith: head_tilt
      head_pan:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Head Pan Joint
        startswith: head_pan
      torso_lift:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Torso Lift Joint
        startswith: torso_lift
      gripper:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Gripper Joint
        startswith: gripper_board
  sensors:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Sensors
    analyzers:
      base_breaker:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Sick TIM551 Laser
        startswith: sick_tim
      camera:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Head Camera
        timeout: 5.0
        startswith: 'head_camera'
        num_items: 2
      imu:
        type: diagnostic_aggregator/GenericAnalyzer
        path: IMU
        timeout: 5.0
        contains: ['IMU']
      #head_camera:
      #  type: diagnostic_aggregator/GenericAnalyzer
      #  path:
      #  startswith:
  peripherals:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Peripherals
    analyzers:
      joy:
        type: diagnostic_aggregator/GenericAnalyzer
        path: PS3 Controller
        find_and_remove_prefix: "jsk_joy_node:"
  system:
    type: diagnostic_aggregator/AnalyzerGroup
    path: System
    analyzers:
      mainboard:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Mainboard
        startswith: Mainboard
      charger:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Charger
        startswith: Charger
  cpu:
    type: diagnostic_aggregator/AnalyzerGroup
    path: CPU
    analyzers:
      mainboard:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Temperature
        startswith: 'my_machine CPU Temperature'
      charger:
        type: diagnostic_aggregator/GenericAnalyzer
        path: CPU Usage
        startswith: 'my_machine CPU Usage'
  topics:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Topics
    analyzers:
      audio:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Audio
        contains: '/audio'
        timeout: 100
        discard_stale: true
      base_scan:
        type: diagnostic_aggregator/GenericAnalyzer
        path: BaseScan
        contains: '/base_scan'
        timeout: 100
        discard_stale: true
      battery_state:
        type: diagnostic_aggregator/GenericAnalyzer
        path: BatteryState
        contains: '/battery_state'
        timeout: 100
        discard_stale: true
      human_pose_estimator:
        type: diagnostic_aggregator/GenericAnalyzer
        path: HumanPoseEstimator
        contains: '/edgetpu_human_pose_estimator/output/image'
        timeout: 100
        discard_stale: true
      object_detector:
        type: diagnostic_aggregator/GenericAnalyzer
        path: ObjectDetector
        contains: '/edgetpu_object_detector/output/image'
        timeout: 100
        discard_stale: true
      gripper_imu:
        type: diagnostic_aggregator/GenericAnalyzer
        path: GripperIMU
        contains: '/gripper/imu'
        timeout: 100
        discard_stale: true
      head_depth_image:
        type: diagnostic_aggregator/GenericAnalyzer
        path: HeadDepthImage
        contains: '/head_camera/depth/image_raw'
        timeout: 100
        discard_stale: true
      head_rgb_image:
        type: diagnostic_aggregator/GenericAnalyzer
        path: HeadRGBImage
        contains: '/head_camera/rgb/image_raw'
        timeout: 100
        discard_stale: true
      imu:
        type: diagnostic_aggregator/GenericAnalyzer
        path: IMU
        contains: '/imu'
        timeout: 100
        discard_stale: true
      insta360:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Insta360
        contains: '/insta360'
        timeout: 100
        discard_stale: true
      joint_states:
        type: diagnostic_aggregator/GenericAnalyzer
        path: JointStates
        contains: '/joint_states'
        timeout: 100
        discard_stale: true
      tf:
        type: diagnostic_aggregator/GenericAnalyzer
        path: TF
        contains: '/tf'
        timeout: 100
        discard_stale: true
  nodes:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Nodes
    analyzers:
      amcl:
        type: diagnostic_aggregator/GenericAnalyzer
        path: amcl
        contains: '/amcl'
        timeout: 100
        discard_stale: true
      auto_dock:
        type: diagnostic_aggregator/GenericAnalyzer
        path: AutoDock
        contains: '/auto_dock'
        timeout: 100
        discard_stale: true
      gripper_driver:
        type: diagnostic_aggregator/GenericAnalyzer
        path: GripperDriver
        contains: '/gripper_driver'
        timeout: 100
        discard_stale: true
      head_camera_manager:
        type: diagnostic_aggregator/GenericAnalyzer
        path: HeadCameraManager
        contains: '/head_camera/head_camera_nodelet_manager'
        timeout: 100
        discard_stale: true
      move_base:
        type: diagnostic_aggregator/GenericAnalyzer
        path: MoveBase
        contains: '/move_base'
        timeout: 100
        discard_stale: true
      move_group:
        type: diagnostic_aggregator/GenericAnalyzer
        path: MoveGroup
        contains: '/move_group'
        timeout: 100
        discard_stale: true
      respeaker_node:
        type: diagnostic_aggregator/GenericAnalyzer
        path: RespeakerNode
        contains: '/respeaker_node'
        timeout: 100
        discard_stale: true
      robot_driver:
        type: diagnostic_aggregator/GenericAnalyzer
        path: RobotDriver
        contains: '/robot_driver'
        timeout: 100
        discard_stale: true
      roswww:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Roswww
        contains: '/roswww'
        timeout: 100
        discard_stale: true
